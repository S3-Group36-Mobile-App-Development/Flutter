name: zenmind
description: "A new Flutter project."
publish_to: 'none'
 
version: 1.0.0+1
 
environment:
  sdk: ^3.13.0
 
dependencies:
  flutter:
    sdk: flutter
 
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  sensors_plus: ^7.1.1
  vibration: ^3.2.1
 
dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
 
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/core/assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "lib/core/assets/images/app_icon.png"
  adaptive_icon_foreground: "lib/core/assets/images/app_icon.png"
  adaptive_icon_foreground_inset: 0
 
flutter:
  uses-material-design: true
 
  assets:
    - lib/core/assets/images/